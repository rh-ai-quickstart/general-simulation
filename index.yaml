    description: 'Umbrella chart for the General Simulation & Impact-Reasoning Platform.
      Deploys Postgres (pgvector + PostGIS), Neo4j, Llama Stack, schema bootstrap,
      the FastAPI API, and the ingestion CronJob. Optional in-cluster vLLM via llm-service
      (OpenShift AI / KServe). Inference always goes through Llama Stack. Enable providers
      via global.models.<key>.enabled and point api/ingestion model IDs at them. Install
      standalone into any namespace, or consume as a Helm subchart from a parent application
      (same release namespace as the parent). '
