# Default values for general-simulation.
#
# Secrets: helm/values-secrets.yaml or --set (never commit passwords/tokens).
# Full reference: helm/values-full.yaml — template defaults in templates/_helpers.tpl.

openshift:
  neo4j:
    scc:
      enabled: true

global:
  postgres:
    password: ""
  neo4j:
    password: ""
  models:
    external-model:
      enabled: true
      id: llama-scout-17b
      url: https://maas-rhdp.apps.maas.redhatworkshops.io/v1
      apiToken: ""
    llama-3-1-8b-instruct-fp8-dynamic:
      enabled: true
      id: RedHatAI/Meta-Llama-3.1-8B-Instruct-FP8-dynamic
      apiToken: unused
      # Cap completion tokens below vLLM --max-model-len (leaves room for tool schemas + history).
      maxTokens: 2048

postgres:
  enabled: true

neo4j:
  enabled: true
  disableLookups: true
  fullnameOverride: neo4j
  config:
    server.bolt.advertised_address: ":443"
    server.http.advertised_address: ":443"
  neo4j:
    acceptLicenseAgreement: "yes"
    edition: community
    name: neo4j
    passwordFromSecret: neo4j-auth
    resources:
      cpu: "2"
      memory: 4Gi
  podSpec:
    serviceAccountName: neo4j-sa
  services:
    neo4j:
      enabled: false
  volumes:
    data:
      mode: defaultStorageClass
      defaultStorageClass:
        accessModes:
          - ReadWriteOnce
        requests:
          storage: 10Gi

bootstrap:
  enabled: true

llama-stack:
  enabled: true
  volumes:
    - configMap:
        defaultMode: 420
        name: general-sim-llamastack-config
      name: run-config-volume
    - name: dot-llama
      persistentVolumeClaim:
        claimName: llama-stack-data
    - emptyDir: {}
      name: cache
  volumeMounts:
    - mountPath: /app-config
      name: run-config-volume
    - mountPath: /.llama
      name: dot-llama
    - mountPath: /.cache
      name: cache

llm-service:
  enabled: true
  models:
    llama-3-1-8b-instruct-fp8-dynamic:
      enabled: true
      id: RedHatAI/Meta-Llama-3.1-8B-Instruct-FP8-dynamic
      device: gpu
      resources:
        limits:
          cpu: "2"
          memory: 16Gi
        requests:
          cpu: "1"
          memory: 8Gi
      args:
        - --max-model-len
        - "8192"
        - --max-num-seqs
        - "16"
        - --gpu-memory-utilization
        - "0.90"
        - --enable-auto-tool-choice
        - --chat-template
        - /chat-templates/tool_chat_template_llama3.2_json.jinja
        - --tool-call-parser
        - llama3_json

api:
  enabled: true
  models:
    generation: external-model/llama-scout-17b
    embedding: sentence-transformers/nomic-ai/nomic-embed-text-v1.5

ingestion:
  enabled: false
