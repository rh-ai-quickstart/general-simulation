# Standalone llm-service install (make deploy-llm-service).
# Umbrella install: set llm-service.enabled in helm/values.yaml.

device: gpu
rawDeploymentMode: true

secret:
  enabled: true
  hf_token: ""

models:
  deepseek-r1-distill-qwen-1-5b:
    enabled: true
    id: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
    device: gpu
    resources:
      limits:
        cpu: "2"
        memory: 16Gi
      requests:
        cpu: "1"
        memory: 8Gi
    args:
      - --max-model-len
      - "8192"
      - --max-num-seqs
      - "32"
      - --gpu-memory-utilization
      - "0.85"
      - --enable-auto-tool-choice
      - --chat-template
      - /chat-templates/tool_chat_template_qwen.jinja
      - --tool-call-parser
      - hermes
