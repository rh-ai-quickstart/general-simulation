# LLM_MODE=local — Llama Stack → in-cluster llm-service / vLLM (OpenShift AI).
# Layer on top of helm/values.yaml:
#   helm upgrade --install ... -f helm/values.yaml -f helm/values-local.yaml

llm:
  mode: local

global:
  models:
    openai:
      enabled: false
    external-model:
      enabled: false
    deepseek-r1-distill-qwen-1-5b:
      enabled: true

llm-service:
  enabled: true
  models:
    deepseek-r1-distill-qwen-1-5b:
      enabled: true

api:
  models:
    generation: deepseek-r1-distill-qwen-1-5b/deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B

ingestion:
  models:
    generation: deepseek-r1-distill-qwen-1-5b/deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
