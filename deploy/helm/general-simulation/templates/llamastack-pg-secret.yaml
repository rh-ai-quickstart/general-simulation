{{- $llamaStack := index .Values "llama-stack" | default dict }}
{{- if and ($llamaStack.enabled | default false) (($llamaStack.pgvector | default dict).enabled | default false) }}
{{- $globalPg := (.Values.global | default dict).postgres | default dict -}}
{{- $postgres := .Values.postgres | default dict -}}
{{- $postgresDb := $postgres.postgres | default dict -}}
# Llama Stack expects a Secret named "pgvector" (keys: user, password, host,
# port, dbname). Point it at this chart's Postgres Service.
apiVersion: v1
kind: Secret
metadata:
  name: pgvector
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: general-sim
    app.kubernetes.io/component: llama-stack
type: Opaque
stringData:
  user: {{ coalesce $postgresDb.username $globalPg.user $globalPg.username "sim" | quote }}
  password: {{ required "global.postgres.password is required" (coalesce $postgresDb.password $globalPg.password "") | quote }}
  host: {{ coalesce $globalPg.host "postgres" | quote }}
  port: {{ coalesce $globalPg.port 5432 | quote | toString }}
  dbname: {{ coalesce $postgresDb.database $globalPg.database "sim" | quote }}
{{- end }}
