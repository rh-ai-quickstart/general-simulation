{{- if and .Values.neo4j.enabled (.Values.openshift.neo4j.scc.enabled | default false) }}
# RoleBinding — grants neo4j-sa the anyuid SCC in this namespace on OpenShift.
# Namespace-scoped so project edit/admin can manage it without cluster-admin.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: neo4j-anyuid
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: general-sim
    app.kubernetes.io/component: neo4j
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: neo4j-sa
    namespace: {{ .Release.Namespace }}
{{- end }}
