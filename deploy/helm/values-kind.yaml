# Kind / plain Kubernetes CI overrides (use with: make helm-install-kind)
#
# Availability contract for helm --wait (must become Ready/Complete):
#   postgres, neo4j (Service name neo4j), general-sim-api, then
#   general-sim-bootstrap post-install hook.
#
# Kept off so they cannot block --wait or pull heavy images:
#   llama-stack, llm-service, OpenSky ingestion CronJob.
# OpenShift Routes disabled (no router on Kind).
#
# Demo passwords so Postgres/Neo4j secret templates render without
# values-secrets.yaml. Local Podman + Kind needs an 8Gi Podman VM
# (Neo4j chart minimum is 2Gi). Run `make kind-preflight` before local smoke.

openshift:
  neo4j:
    scc:
      enabled: false

global:
  registry: localhost:5001
  imageTag: latest
  postgres:
    password: kind-demo-password
  neo4j:
    password: kind-demo-password
  models:
    openai:
      enabled: false
    deepseek-r1-distill-qwen-1-5b:
      enabled: false
    external-model:
      enabled: false

postgres:
  enabled: true
  postgres:
    password: kind-demo-password

pgvector:
  enabled: false

neo4j:
  enabled: true
  fullnameOverride: neo4j
  disableLookups: true
  # SCC off skips ServiceAccount/neo4j-sa; clear the chart default SA.
  podSpec:
    serviceAccountName: default
  neo4j:
    resources:
      # Official neo4j chart fails helm template below 2Gi — this is the floor.
      cpu: "500m"
      memory: 2Gi
  volumes:
    data:
      mode: dynamic
      dynamic:
        accessModes:
          - ReadWriteOnce
        requests:
          storage: 2Gi
        # Kind local-path provisioner (default StorageClass name).
        storageClassName: standard

llama-stack:
  enabled: false

llm-service:
  enabled: false

api:
  enabled: true
  route:
    enabled: false
  llm:
    backend: fake
    # Not used by FakeLLMClient; keeps Secret non-empty for Kind.
    apiKey: kind-unused
    baseUrl: http://127.0.0.1:9/v1
  postgres:
    password: kind-demo-password
  neo4j:
    password: kind-demo-password
  # Fake backend ignores the model id; keep a stable placeholder.
  models:
    generation: fake/canned
    embedding: sentence-transformers/nomic-ai/nomic-embed-text-v1.5

bootstrap:
  enabled: true
  postgres:
    password: kind-demo-password
  neo4j:
    password: kind-demo-password

ingestion:
  enabled: false
  postgres:
    password: kind-demo-password
  neo4j:
    password: kind-demo-password
