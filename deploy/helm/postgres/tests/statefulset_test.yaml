suite: postgres statefulset
templates:
  - templates/statefulset.yaml
release:
  name: general-simulation
  namespace: general-simulation
tests:
  - it: runs postgres as UID 999 with age preloaded
    set:
      postgres.password: demo-pg
      image: quay.io/rh-ai-quickstart/general-sim-postgres:dev
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.name
          value: postgres
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 999
      - equal:
          path: spec.template.spec.serviceAccountName
          value: postgres-sa
      - contains:
          path: spec.template.spec.containers[0].args
          content: shared_preload_libraries=age
      - equal:
          path: spec.template.spec.containers[0].image
          value: quay.io/rh-ai-quickstart/general-sim-postgres:dev
