suite: postgres secret
templates:
  - templates/secret.yaml
release:
  name: general-simulation
  namespace: general-simulation
tests:
  - it: creates postgres-credentials from values
    set:
      postgres.password: demo-pg
      postgres.username: sim
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: postgres-credentials
      - equal:
          path: stringData.username
          value: sim
      - equal:
          path: stringData.password
          value: demo-pg
