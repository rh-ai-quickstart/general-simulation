apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DSN: {{ include "api.postgresDSN" . | quote }}
  OPENAI_API_KEY: {{ .Values.llm.apiKey | quote }}
  NEO4J_URI: {{ include "api.neo4jURI" . | quote }}
  NEO4J_PASSWORD: {{ include "api.neo4jPassword" . | quote }}
