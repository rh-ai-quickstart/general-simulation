suite: api secret
templates:
  - templates/secret.yaml
release:
  name: general-simulation
  namespace: general-simulation
tests:
  - it: wires postgres and neo4j credentials
    set:
      postgres.password: demo-pg
      neo4j.password: demo-neo4j
      llm.apiKey: sk-test
      postgres.host: postgres
      postgres.port: 5432
      postgres.user: sim
      postgres.database: sim
      neo4j.host: neo4j
      neo4j.port: 7687
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: app-secrets
      - matchRegex:
          path: stringData.POSTGRES_DSN
          pattern: "^postgresql://sim:demo-pg@postgres:5432/sim$"
      - equal:
          path: stringData.NEO4J_URI
          value: bolt://neo4j:7687
      - equal:
          path: stringData.NEO4J_PASSWORD
          value: demo-neo4j
      - equal:
          path: stringData.OPENAI_API_KEY
          value: sk-test
