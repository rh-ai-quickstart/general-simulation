apiVersion: batch/v1
kind: Job
metadata:
  name: general-sim-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bootstrap.labels" . | nindent 4 }}
  annotations:
    # Helm hook — runs after all chart resources are applied.
    "helm.sh/hook": post-install,post-upgrade
    # Delete the old Job before creating a new one (idempotent re-runs).
    # Succeeded Jobs are also cleaned up automatically.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  # Allow init wait (up to waitFor.timeoutSeconds) plus schema apply.
  activeDeadlineSeconds: {{ add .Values.waitFor.timeoutSeconds 180 }}
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "bootstrap.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
      {{- include "bootstrap.waitForDepsInit" . | nindent 6 }}
      containers:
        - name: bootstrap
          image: {{ include "bootstrap.containerImage" . }}
          imagePullPolicy: Always
          command: ["bootstrap-schema"]
          env:
            - name: POSTGRES_DSN
              value: {{ include "bootstrap.postgresDSN" . | quote }}
            - name: NEO4J_URI
              value: {{ printf "bolt://%s:%v" (include "bootstrap.neo4jHost" .) (include "bootstrap.neo4jPort" .) | quote }}
            - name: NEO4J_USER
              value: {{ include "bootstrap.neo4jUser" . | quote }}
            - name: NEO4J_PASSWORD
              value: {{ include "bootstrap.neo4jPassword" . | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
