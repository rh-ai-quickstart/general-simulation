apiVersion: batch/v1
kind: CronJob
metadata:
  name: general-sim-ingestion
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ingestion.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            {{- include "ingestion.selectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
          containers:
            {{- include "ingestion.container" . | nindent 12 }}
          volumes:
            - name: tmp
              emptyDir: {}
