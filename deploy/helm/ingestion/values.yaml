image: ""
imageName: general-sim-api

# Cron schedule (default: every 10 minutes).
schedule: "*/10 * * * *"

# Run ingestion once on helm install/upgrade (post-hook Job), without waiting for CronJob.
runOnDeploy:
  enabled: true

# Block the hook Job until Postgres + Neo4j accept TCP (after bootstrap schema apply).
waitFor:
  enabled: true
  timeoutSeconds: 300

# Adapter to run. Must match an adapter_id from an ENABLED_DOMAINS package.
# Scheduled pull — OpenSky live feed. Shipping uses fixture ingest / seed_shipping.
adapterId: opensky_flights

# Comma-separated domain packages to load (adapters + optional solvers).
enabledDomains: aviation,shipping

postgres:
  # Short name — resolves in the release namespace (standalone or as a subchart).
  host: postgres
  port: 5432
  user: sim
  password: ""   # required — pass via --set postgres.password=<pw>
  database: sim

neo4j:
  # Short name — same-namespace Service DNS.
  host: neo4j
  port: 7687
  user: neo4j
  password: ""   # required — pass via --set neo4j.password=<pw>

llm:
  # Always Llama Stack — see helm/values.yaml and mode overlays.
  baseUrl: "http://llamastack:8321/v1"
  apiKey: "unused"
  backend: "openai"

models:
  generation: openai/gpt-4o-mini
  embedding: nomic-ai/nomic-embed-text-v1.5
  embeddingDimension: "768"

resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m
