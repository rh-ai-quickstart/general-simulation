name: Kind Helm smoke

# Helm lint, Kind deploy, and API verification (health + seed + /query with fake LLM).
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master, development]
    paths:
      - "apps/**"
      - "lib/**"
      - "domain/**"
      - "deploy/**"
      - "scripts/ci/**"
      - "scripts/local-kind-smoke-test.sh"
      - "scripts/seed_demo.py"
      - "scripts/smoke-uk-closure.sh"
      - "Makefile"
      - ".github/actions/kind/**"
      - ".github/workflows/kind-helm-smoke.yml"
  push:
    branches: [main, master, development]
    paths:
      - "apps/**"
      - "lib/**"
      - "domain/**"
      - "deploy/**"
      - "scripts/ci/**"
      - "scripts/local-kind-smoke-test.sh"
      - "scripts/seed_demo.py"
      - "scripts/smoke-uk-closure.sh"
      - "Makefile"
      - ".github/actions/kind/**"
      - ".github/workflows/kind-helm-smoke.yml"

concurrency:
  group: kind-helm-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  KIND_NAMESPACE: general-simulation
  HELM_RELEASE: general-simulation

jobs:
  kind-helm-smoke:
    name: Helm lint, Kind deploy, API verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.4

      - name: Helm chart lint
        run: make lint-charts

      - name: Deploy chart on Kind
        uses: ./.github/actions/kind
        with:
          namespace: ${{ env.KIND_NAMESPACE }}
          helm_release: ${{ env.HELM_RELEASE }}
          registry: localhost:5001
          run_builtin_smoke: "false"

      - name: Verify deployment (health, seed, /query)
        shell: bash
        run: make kind-verify
        env:
          NAMESPACE: ${{ env.KIND_NAMESPACE }}
          HELM_RELEASE_NAME: ${{ env.HELM_RELEASE }}
